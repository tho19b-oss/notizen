/* =========================================================================
   12 · FOKUS
   ========================================================================= */
function rowEl(id) {
  var rows = $$(".item");
  for (var i = 0; i < rows.length; i++) if (rows[i].dataset.id === id) return rows[i];
  return null;
}
function captureFocus() {
  var a = document.activeElement;
  if (!a || a === document.body) return null;
  var row = a.closest ? a.closest(".item") : null;
  if (!row) return null;
  return { id: row.dataset.id, fr: (a.dataset && a.dataset.fr) || "cb", tag: a.dataset && a.dataset.tag };
}
function restoreFocus(mark) {
  if (!mark) return;
  var row = rowEl(mark.id);
  if (!row) return;
  var target = null;
  if (mark.fr === "chip" && mark.tag) {
    $$(".chip", row).forEach(function (c) { if (!target && c.dataset.tag === mark.tag) target = c; });
  }
  if (!target) target = row.querySelector('[data-fr="' + (mark.fr || "cb") + '"]');
  if (!target) target = row.querySelector(".cb");
  if (target) { ui.rovingId = mark.id; restoreRoving(); target.focus({ preventScroll: true }); }
}
function restoreRoving() {
  var cbs = $$(".cb");
  cbs.forEach(function (c) { c.tabIndex = -1; });
  if (!cbs.length) { ui.rovingId = null; return; }
  var found = null;
  if (ui.rovingId) {
    for (var i = 0; i < cbs.length; i++) {
      var r = cbs[i].closest(".item");
      if (r && r.dataset.id === ui.rovingId) { found = cbs[i]; break; }
    }
  }
  if (!found) { found = cbs[0]; ui.rovingId = found.closest(".item").dataset.id; }
  found.tabIndex = 0;
}
function focusRoving() {
  restoreRoving();
  var cbs = $$(".cb");
  for (var i = 0; i < cbs.length; i++) if (cbs[i].tabIndex === 0) { cbs[i].focus(); return; }
  if (cbs.length) cbs[0].focus();
}
function focusRow(id, fr) {
  var row = rowEl(id);
  if (!row) return;
  ui.rovingId = id;
  restoreRoving();
  var t = row.querySelector('[data-fr="' + (fr || "cb") + '"]') || row.querySelector(".cb");
  if (t) t.focus({ preventScroll: false });
}

/* =========================================================================
   13 · AKTIONEN
   ========================================================================= */
function findItem(id) {
  for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
  return null;
}

function addItems(raw, forceImportant) {
  var todayKey = syncToday();
  var lines = ui.multilineMode === "split"
    ? raw.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean)
    : [raw.trim()];

  /* Erst aufbereiten, dann schreiben: sonst entsteht ein leerer Undo-Schritt,
     wenn nach dem Abziehen des ! nichts übrig bleibt. */
  var prepared = [];
  for (var li = 0; li < lines.length; li++) {
    var parsed = extractBang(lines[li].slice(0, MAX_LEN));
    var t = parsed.text.normalize("NFC").slice(0, MAX_LEN);
    if (t) prepared.push({ text: t, important: !!(parsed.important || forceImportant) });
  }
  if (!prepared.length) return;

  var created = [], now = Date.now();
  withUndo(prepared.length === 1 ? "Eintrag" : "Einträge", function (st) {
    for (var i = 0; i < prepared.length; i++) {
      var seq = st.meta.seqCounter++;
      var item = {
        id: newId(seq), text: prepared[i].text, done: false,
        important: prepared[i].important, pinned: false,
        createdAt: now + i, createdDayKey: todayKey, dayKey: todayKey,
        doneAt: null, doneDayKey: null, updatedAt: now + i, seq: seq, carryCount: 0,
        tags: tagsOf(prepared[i].text)
      };
      st.items.push(item);
      created.push(item);
    }
  });
  var undoEntry = Undo.lastEntry;
  if (!created.length) return;

  renderAll();
  var last = created[created.length - 1];
  var li = rowEl(last.id);
  if (li && !reduceMotion()) {
    var wrap = li.closest(".rowgrid");
    if (wrap) { wrap.classList.add("enter"); setTimeout(function () { wrap.classList.remove("enter"); }, 400); }
  }
  var sweep = document.getElementById("sweep");
  sweep.classList.remove("run");
  void sweep.offsetWidth;
  if (!reduceMotion()) sweep.classList.add("run");

  var openToday = 0;
  for (var i = 0; i < state.items.length; i++) {
    var it = state.items[i];
    if (it.dayKey === ui.todayKey && !it.done) openToday++;
  }
  var hidden = isFiltered() && !itemPassesFilter(last);
  announce(hidden
    ? "Hinzugefügt, durch den aktuellen Filter ausgeblendet."
    : "Hinzugefügt: " + last.text + ". " + openToday + " offene Einträge heute.");
  if (created.length > 1) showToast(created.length + " Einträge angelegt", function () { Undo.revertTo(undoEntry); });
}

function toggleDone(id) {
  var todayKey = syncToday();
  var item = findItem(id);
  if (!item) return;
  var wasDone = item.done;
  var willReopenAndCarry = wasDone && state.settings.carryOver && !item.pinned && item.dayKey < todayKey;
  var now = Date.now();

  withItem(id, wasDone ? "Wieder geöffnet" : "Erledigt", function (it) {
    if (wasDone) {
      it.done = false; it.doneAt = null; it.doneDayKey = null;
      if (willReopenAndCarry) { it.dayKey = todayKey; it.carryCount = (it.carryCount || 0) + 1; }
    } else {
      it.done = true; it.doneAt = now; it.doneDayKey = todayKey;
    }
    it.updatedAt = now;
  });
  var undoEntry = Undo.lastEntry;
  item = findItem(id);
  if (!item) { renderAll(); return; }

  if (willReopenAndCarry) {
    renderAll();
    focusRow(id, "cb");
    announce("Wieder offen. Nach heute übernommen.");
    showToast("Wieder offen und auf heute übernommen", function () { Undo.revertTo(undoEntry); });
    return;
  }

  /* Position bleibt, damit die Geste nicht abreißt. */
  var row = rowEl(id);
  if (!row) { renderAll(); return; }
  var cb = row.querySelector(".cb");
  row.classList.toggle("done", item.done);
  if (cb) cb.checked = item.done;

  if (item.done && !reduceMotion() && cb) {
    cb.classList.remove("pop", "ripple");
    void cb.offsetWidth;
    cb.classList.add("pop", "ripple");
    var strip = function () { cb.classList.remove("pop", "ripple"); };
    cb.addEventListener("animationend", strip, { once: true });
    setTimeout(strip, 600);
  }
  $$(".text", row).forEach(function (t) {
    if (!item.done) { t.classList.add("retract"); setTimeout(function () { t.classList.remove("retract"); }, 260); }
  });

  var oldMeta = row.querySelector(".meta");
  if (oldMeta) oldMeta.parentNode.replaceChild(buildMeta(item), oldMeta);
  refreshCounter(row.closest(".day"));
  renderFooter();
  if (ui.query) { ui.lastVisible = state.items.filter(itemPassesFilter); renderChrome(); }

  if (isFiltered() && !itemPassesFilter(item)) row.classList.add("is-leaving");
  else row.classList.remove("is-leaving");

  announce(item.done ? "Erledigt: " + item.text : "Wieder offen: " + item.text);
}

function refreshCounter(section) {
  if (!section) return;
  var key = section.dataset.key;
  var c = countDay(key), total = c.total, done = c.done;
  var out = section.querySelector(".day__count");
  if (!out) return;
  var narrow = window.innerWidth <= 400;
  var s = !total ? "" : narrow ? done + "/" + total : (done === total ? "Alles erledigt" : done + " von " + total + " erledigt");
  if (key !== ui.todayKey && total) {
    var away = countMovedAway(key);
    if (away) s += " · " + away + " mitgenommen";
  }
  out.textContent = s;
}

function toggleImportant(id) {
  var item = findItem(id);
  if (!item) return;
  var rects = Object.create(null);
  $$(".item").forEach(function (r) { rects[r.dataset.id] = r.getBoundingClientRect().top; });

  var willBe = !item.important;
  withItem(id, "Wichtig", function (it) {
    it.important = willBe;
    it.updatedAt = Date.now();
  });
  item = findItem(id);
  if (!item) { renderAll(); return; }
  renderAll();

  var row = rowEl(id);
  if (row && item.important && !reduceMotion()) row.classList.add("rail-in");
  if (!reduceMotion()) {
    $$(".item").forEach(function (r) {
      var was = rects[r.dataset.id];
      if (was === undefined) return;
      var d = was - r.getBoundingClientRect().top;
      if (!d) return;
      r.style.transform = "translateY(" + d + "px)";
      r.style.transition = "none";
      window.requestAnimationFrame(function () {
        r.style.transition = "transform 260ms var(--ease-out)";
        r.style.transform = "";
        r.addEventListener("transitionend", function () { r.style.transition = ""; }, { once: true });
      });
    });
  } else if (row) { row.classList.add("moved"); setTimeout(function () { row.classList.remove("moved"); }, 2000); }
  focusRow(id, "imp");
  announce(item.important ? "Als wichtig markiert. Nach oben verschoben." : "Wichtig-Markierung entfernt.");
}

function deleteItem(id) {
  var item = findItem(id);
  if (!item) return;
  var row = rowEl(id);
  var next = null, cbs = $$(".cb"), i;
  for (i = 0; i < cbs.length; i++) {
    var r = cbs[i].closest(".item");
    if (r.dataset.id === id) { next = (cbs[i + 1] || cbs[i - 1]); break; }
  }
  var nextId = next ? next.closest(".item").dataset.id : null;

  withUndo("Eintrag gelöscht", function (st) {
    st.items = st.items.filter(function (x) { return x.id !== id; });
    st.tombstones.push({ id: id, deletedAt: Date.now() });
  });
  var undoEntry = Undo.lastEntry;
  foldCache.delete(id);
  if (nextId) ui.rovingId = nextId;
  announce("Eintrag gelöscht. Rückgängig mit Strg+Z.");
  showToast("Eintrag gelöscht", function () { Undo.revertTo(undoEntry); });

  function paint() {
    renderAll();
    if (nextId) focusRow(nextId, "cb");
    else document.getElementById("composer").focus();
  }
  if (row && !reduceMotion()) {
    var wrap = row.closest(".rowgrid");
    if (wrap) { wrap.classList.add("leave"); setTimeout(paint, 340); return; }
  }
  paint();
}

function setPinned(id, pinned, toDay) {
  var item = findItem(id);
  if (!item) return;
  withItem(id, pinned ? "Angeheftet" : "Übernahme", function (it) {
    it.pinned = pinned;
    if (pinned && toDay) it.dayKey = toDay;
    it.updatedAt = Date.now();
  });
  if (!pinned) carryOverPass(true);
  renderAll();
  focusRow(id, "cb");
  var it = findItem(id);
  announce(!pinned ? "Wird wieder auf heute übernommen."
    : toDay ? "Bleibt am Ursprungstag." : "Wird nicht auf heute übernommen.");
}
function pullToToday(id) {
  var item = findItem(id);
  if (!item) return;
  var todayKey = syncToday();
  withItem(id, "Auf heute geholt", function (it) {
    it.dayKey = todayKey;
    it.updatedAt = Date.now();
  });
  renderAll();
  focusRow(id, "cb");
}

/* ---- Bearbeiten an Ort und Stelle ---- */
function startEdit(id) {
  if (ui.editingId && ui.editingId !== id) commitEdit();
  var item = findItem(id), row = rowEl(id);
  if (!item || !row) return;
  ui.editingId = id;
  row.classList.add("editing");
  var body = row.querySelector(".body");
  body.textContent = "";

  var ta = el("textarea", "edit");
  ta.value = item.text;
  ta.maxLength = MAX_LEN;
  ta.setAttribute("aria-label", "Eintrag bearbeiten");
  ta.spellcheck = true;
  body.appendChild(ta);
  body.appendChild(el("span", "edithint", "Eingabe speichert · Umschalt+Eingabe neue Zeile · Esc verwirft"));
  var btns = el("div", "editbtns");
  var save = el("button", "primary", "Speichern"); save.type = "button";
  var cancel = el("button", "ghost", "Abbrechen"); cancel.type = "button";
  var count = el("span", "charcount", "");
  btns.appendChild(save); btns.appendChild(cancel); btns.appendChild(count);
  body.appendChild(btns);

  function grow() {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
    var left = MAX_LEN - ta.value.length;
    count.textContent = left <= 200 ? (left <= 0 ? "Maximal 2000 Zeichen" : "noch " + left + " Zeichen") : "";
  }
  ta.addEventListener("input", grow);
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelEdit(); }
  });
  save.addEventListener("click", commitEdit);
  cancel.addEventListener("click", cancelEdit);
  grow();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
/* Speichert stillschweigend, ohne neu zu zeichnen. Wird von jedem
   fremdausgelösten Neuzeichnen aufgerufen, damit getippter Text nie verfällt. */
function commitEditQuiet() {
  var id = ui.editingId;
  if (!id) return;
  var row = rowEl(id), ta = row && row.querySelector(".edit");
  ui.editingId = null;
  if (!row || !ta) return;
  var next = ta.value.trim().slice(0, MAX_LEN).normalize("NFC");
  var item = findItem(id);
  if (!item || !next || next === item.text) return;
  withItem(id, "Bearbeitung", function (it) {
    it.text = next; it.tags = tagsOf(next); it.updatedAt = Date.now();
  });
  foldCache.delete(id);
}
function commitEdit() {
  var id = ui.editingId;
  if (!id) return;
  var row = rowEl(id), ta = row && row.querySelector(".edit");
  if (!row || !ta) { ui.editingId = null; return; }
  var next = ta.value.trim().slice(0, MAX_LEN).normalize("NFC");
  ui.editingId = null;
  var item = findItem(id);
  if (!item) { renderAll(); return; }
  if (!next) { deleteItem(id); return; }
  if (next !== item.text) {
    withItem(id, "Bearbeitung", function (it) {
      it.text = next; it.tags = tagsOf(next); it.updatedAt = Date.now();
    });
    foldCache.delete(id);
  }
  renderAll();
  focusRow(id, "cb");
}
function cancelEdit() {
  var id = ui.editingId;
  ui.editingId = null;
  if (!id) return;
  renderAll();
  focusRow(id, "cb");
  announce("Bearbeitung abgebrochen.");
}

/* =========================================================================
   14 · DESIGN HELL / DUNKEL / SYSTEM
   ========================================================================= */
var THEME_ORDER = ["system", "hell", "dunkel"];
var THEME_ICON  = { system: "monitor", hell: "sun", dunkel: "moon" };

function applyTheme() {

  else document.documentElement.setAttribute("data-theme", t);
}
function renderThemeButton() {
  var b = document.getElementById("themeBtn");
  b.textContent = "";
  b.appendChild(icon(THEME_ICON[state.settings.theme]));

function exportFilename() { return "notizen-" + ui.todayKey + ".json"; }
function doExport() {
  var json = JSON.stringify(state, null, 2);
  var ok = false;
  try {
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = exportFilename();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    ok = true;
  } catch (e) { ok = false; }
  if (!ok) { exportFallback(json); return; }
  state.settings.lastExportAt = Date.now();
  mutate(function () {});
  renderFooter();
  showToast("Export gestartet: " + exportFilename());
}
function exportFallback(json) {
  openModal(function (box) {
    box.appendChild(el("h2", null, "Daten exportieren"));
    box.appendChild(el("p", null, "Text markieren und mit Strg+C kopieren."));
    var ta = document.createElement("textarea");
    ta.readOnly = true;
    ta.value = json;
    box.appendChild(ta);
    var foot = el("div", "modal__foot");
    var copy = el("button", "primary", "Kopieren");
    copy.type = "button";
    copy.addEventListener("click", function () {
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).catch(function () {});
      else { try { document.execCommand("copy"); } catch (e) {} }
      copy.textContent = "Kopiert";
    });
    var close = el("button", "ghost", "Schließen");
    close.type = "button";
    close.addEventListener("click", closeModal);
    foot.appendChild(copy); foot.appendChild(close);
    box.appendChild(foot);
  }, "Daten exportieren");
}
function doImport() {
  var input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", function () {
    var f = input.files && input.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(rd.result)); }
      catch (e) { showToast("Datei konnte nicht gelesen werden."); return; }
      var incoming = normalise(parsed, ui.todayKey);
      var before = Undo.snap();
      var added = mutate(function (st) {
        var byId = Object.create(null), i;
        for (i = 0; i < st.items.length; i++) byId[st.items[i].id] = st.items[i];
        var added = 0;
        for (i = 0; i < incoming.items.length; i++) {
          var it = incoming.items[i];
          if (!byId[it.id] || it.updatedAt > byId[it.id].updatedAt) { byId[it.id] = it; added++; }
        }
        var out = [];
        for (var k in byId) out.push(byId[k]);
        st.items = out;
        st.meta.seqCounter = Math.max(st.meta.seqCounter, incoming.meta.seqCounter);
        return added;
      });
      Undo.push("Import", before);
      foldCache.clear();
      carryOverPass(true);
      renderAll();
      showToast(added ? (added === 1 ? "1 Eintrag übernommen." : added + " Einträge übernommen.")
                      : "Nichts Neues in der Datei.",
        added ? function () { Undo.undo(); } : null);
    };
    rd.readAsText(f);
  });
  input.click();
}
function downloadCorruptBackup() {
  var found = null;
  try {
    for (var i = 0; i < window.localStorage.length; i++) {
      var k = window.localStorage.key(i);
      if (k && k.indexOf("notizen.corrupt.") === 0) found = window.localStorage.getItem(k);
    }
  } catch (e) {}
  exportFallback(found || "(keine Sicherung gefunden)");
}

   der Zeilen sind ebenfalls INPUT-Elemente, dort muessen j, k, w, Entf
   und die Pfeiltasten weiterhin wirken. */
var TEXT_INPUT_TYPES = { text:1, search:1, email:1, url:1, tel:1, password:1, number:1, date:1, "datetime-local":1, month:1, week:1, time:1 };
function inTextField() {
  var a = document.activeElement;
  if (!a) return false;
  if (a.isContentEditable) return true;
  if (a.tagName === "TEXTAREA") return true;
  if (a.tagName === "INPUT") return !!TEXT_INPUT_TYPES[(a.type || "text").toLowerCase()];
  return false;
}
/* Kontext-Prüfung: gilt für JEDE Taste, unabhängig von der Einstellung. */
function keysAllowed(e) {
  if (!state) return false;
  if (e.ctrlKey || e.altKey || e.metaKey) return false;
  if (e.isComposing) return false;
  if (openModalNode || ui.openPopover) return false;
  if (inTextField()) return false;
  return true;
}
/* Zusätzlich: sind einzelne Schriftzeichen als Kürzel erlaubt?
   Navigations- und Bearbeitungstasten fragen das absichtlich NICHT ab. */
function singleKeysAllowed() {
  return !!(state && state.settings.shortcuts);
}

function onKeydown(e) {
  if (e.key === "Escape") {
    if (openModalNode) { e.preventDefault(); closeModal(); return; }
    if (ui.openPopover) { e.preventDefault(); closePopover(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "z" || e.key === "Z")) {
    if (inTextField()) return;                 /* im Feld gehört Strg+Z dem Feld */
    e.preventDefault();
    if (e.shiftKey) Undo.redo(); else Undo.undo();
    return;
  }
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === "ArrowUp" || e.key === "ArrowDown") &&
      !inTextField() && !openModalNode && !ui.openPopover) {
    e.preventDefault();
    var heads = $$(".day__head");
    var cur = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".day") : null;
    var ix = cur ? heads.indexOf(cur.querySelector(".day__head")) : -1;
    var t = e.key === "ArrowDown" ? ix + 1 : ix - 1;
    if (t >= 0 && t < heads.length) { heads[t].focus(); announce(heads[t].textContent); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !inTextField() && !openModalNode && !ui.openPopover &&
      (e.key === "Home" || e.key === "End")) {
    e.preventDefault();
    moveTo(e.key === "Home" ? 0 : visibleCbs().length - 1);
    return;
  }
  if (!keysAllowed(e)) return;
  var einzeltasten = singleKeysAllowed();

  /* Auf einem Knopf oder Chip gehören Eingabe und Leertaste dem Knopf. */
  var ae = document.activeElement;
  if (ae && ae.classList && (ae.classList.contains("act") || ae.classList.contains("chip")) &&
      (e.key === "Enter" || e.key === " ")) return;

  var i = currentIndex();
  var inRow = i >= 0;
  var id = inRow ? visibleCbs()[i].closest(".item").dataset.id : null;

  /* Einzelne Buchstaben klein schreiben, damit die Feststelltaste nichts bricht.
     Namen wie "ArrowDown" sind länger als ein Zeichen und bleiben unberührt. */
  var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (einzeltasten) switch (key) {
    case "n":
      e.preventDefault(); document.getElementById("composer").focus(); return;
    case "/":
      e.preventDefault(); document.getElementById("search").focus(); return;
    case "1": e.preventDefault(); setStatusFilter("alle"); return;
    case "2": e.preventDefault(); setStatusFilter("offen"); return;
    case "3": e.preventDefault(); setStatusFilter("erledigt"); return;
    case "?":
      e.preventDefault(); openShortcuts(); return;
    case "w":
      if (e.shiftKey) {
        e.preventDefault();
        state.settings.ui.onlyImportant = !state.settings.ui.onlyImportant;
        mutate(function () {}); renderAll();
        announce(state.settings.ui.onlyImportant ? "Nur wichtige Einträge." : "Alle Einträge.");
        return;
      }
      break;
    case "d":
      if (e.shiftKey) { e.preventDefault(); cycleTheme(); return; }
      break;
  }
  if (!inRow) return;

  switch (key) {
    case "ArrowDown": e.preventDefault(); moveTo(i + 1); break;
    case "ArrowUp":   e.preventDefault(); moveTo(i - 1); break;
    case "j": if (einzeltasten) { e.preventDefault(); moveTo(i + 1); } break;
    case "k": if (einzeltasten) { e.preventDefault(); moveTo(i - 1); } break;
    case "PageDown": e.preventDefault(); moveTo(i + 10); break;
    case "PageUp":   e.preventDefault(); moveTo(i - 10); break;
    case "Home": case "End": {
      e.preventDefault();
      var day = visibleCbs()[i].closest(".day");
      var inDay = $$(".cb", day);
      var target = e.key === "Home" ? inDay[0] : inDay[inDay.length - 1];
      if (target) moveTo(visibleCbs().indexOf(target));
      break;
    }
    case "ArrowRight": case "ArrowLeft": {
      e.preventDefault();
      var row = visibleCbs()[i].closest(".item");
      var ctrls = $$("[data-fr]", row).filter(function (n) { return n.offsetParent !== null || n.classList.contains("cb"); });
      var ci = ctrls.indexOf(document.activeElement);
      var nx = ci + (e.key === "ArrowRight" ? 1 : -1);
      if (nx >= 0 && nx < ctrls.length) ctrls[nx].focus();
      break;
    }
    case " ": {
      if (document.activeElement && document.activeElement.classList.contains("cb")) return; /* nativ */
      e.preventDefault();
      toggleDone(id);
      break;
    }
    case "Enter": case "F2": e.preventDefault(); startEdit(id); break;
    case "w": if (einzeltasten) { e.preventDefault(); toggleImportant(id); } break;
    case "Delete": e.preventDefault(); deleteItem(id); break;
  }
}

/* =========================================================================
   20 · TAGESWECHSEL, ZWEITER TAB, SICHERN
   ========================================================================= */
function checkDayRollover() {
  var k = dayKeyOf(new Date());
  if (k === ui.todayKey) return;
  if (ui.editingId) commitEditQuiet();
  var composerEl = document.getElementById("composer");
  var val = composerEl.value, selStart = composerEl.selectionStart;
  var focusMark = captureFocus();
  ui.todayKey = k;
  var moved = carryOverPass(true);
  renderAll();
  composerEl.value = val;
  try { composerEl.setSelectionRange(selStart, selStart); } catch (e) {}
  if (focusMark) restoreFocus(focusMark);
  announce("Neuer Tag. " + (moved.length ? moved.length + " offene Einträge nach " + fmtLong(k) + " übernommen." : fmtLong(k) + "."));
}
function heartbeat() {
  if (!Store.available || document.visibilityState !== "visible") return;
  var other = null;
  try { var r = Store.getRaw(HB_KEY); other = r ? JSON.parse(r) : null; } catch (e) { other = null; }
  if (other && other.id !== state.meta.writerId && typeof other.at === "number" &&
      Date.now() - other.at < 25000) showBanner("secondtab");
  else hideBanner("secondtab");
  if (!Store.readOnly) Store.setRaw(HB_KEY, JSON.stringify({ id: state.meta.writerId, at: Date.now() }));
}

/* =========================================================================
   21 · START
   ========================================================================= */
function boot() {
  ui.todayKey = dayKeyOf(new Date());
  Store.probe();
  if (!Store.available) showBanner("nostorage");

  var raw = Store.getRaw(STORAGE_KEY);
  var parsed = null, rawOk = false;
  if (raw) {
    try { parsed = JSON.parse(raw); rawOk = true; }
    catch (e) {
      try { Store.setRaw("notizen.corrupt." + Date.now(), raw); } catch (e2) {}
      var bak = Store.getRaw(BACKUP_KEY);
      if (bak) { try { parsed = JSON.parse(bak); } catch (e3) { parsed = null; } }
      showBanner("corrupt");
    }
  }
  if (parsed && typeof parsed.schema === "number" && parsed.schema > SCHEMA) {
    Store.readOnly = true;
    showBanner("readonly");
  }
  state = normalise(parsed, ui.todayKey);
  /* Niemals eine intakte Sicherung mit unlesbaren Rohdaten überschreiben. */
  if (rawOk && !Store.readOnly) Store.setRaw(BACKUP_KEY, raw);

  applyTheme();
  ui.widthBucket = widthBucket();
  wireEvents();
  growComposer();

  var moved = carryOverPass(false);
  renderAll();

  window.setInterval(checkDayRollover, 30000);
  window.setInterval(heartbeat, 10000);
  ["visibilitychange", "focus", "pageshow"].forEach(function (ev) {
    (ev === "visibilitychange" ? document : window).addEventListener(ev, function () {
      if (ev === "visibilitychange" && document.visibilityState !== "visible") {
        if (ui.editingId) commitEditQuiet();
        Store.flush();
        return;
      }
      checkDayRollover();
      carryOverPass(true);
    });
  });
  window.addEventListener("pagehide", function () {
    if (ui.editingId) commitEditQuiet();
    Store.flush();
    Store.delRaw(HB_KEY);        /* sonst hält sich der eigene Tab für einen zweiten */
  });
  window.addEventListener("beforeunload", function () { Store.flush(); });
  window.addEventListener("storage", function (e) {
    if (e.key && e.key !== STORAGE_KEY) return;
    var fresh = Store.readParsed();
    if (!fresh || !fresh.meta || fresh.meta.writerId === state.meta.writerId) return;
    if (JSON.stringify(fresh.items) === JSON.stringify(state.items)) return;
    var composerEl = document.getElementById("composer");
    var val = composerEl.value, sel = composerEl.selectionStart, y = window.scrollY;
    mergeStates(state, normalise(fresh, ui.todayKey));
    foldCache.clear();
    renderAll();
    composerEl.value = val;
    try { composerEl.setSelectionRange(sel, sel); } catch (err) {}
    window.scrollTo(0, y);
  });

  window.requestAnimationFrame(function () {
    growComposer();
    updateChromeHeight();
    measureLines();
    window.requestAnimationFrame(function () { document.body.classList.remove("preload"); });
  });
  if (moved && moved.length) {
    announce(moved.length + " offene Einträge auf heute übernommen.");
  }
}

try { boot(); }
catch (err) {
  console.error(err);
  var host = document.getElementById("days");
  if (host) {
    host.textContent = "";
    var p = document.createElement("p");
    p.className = "empty__text";
    p.textContent = "Die App konnte nicht starten: " + (err && err.message ? err.message : String(err));
    host.appendChild(p);
  }
}
</script>
</body>
</html>
